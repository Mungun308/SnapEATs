<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Profile - SnapEATs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .restaurant-header {
            position: relative;
            height: 300px;
            overflow: hidden;
            border-radius: 0 0 20px 20px;
        }
        
        .restaurant-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .restaurant-info {
            background: var(--color-white);
            margin-top: -50px;
            border-radius: 20px 20px 0 0;
            position: relative;
            padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        
        .restaurant-logo {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            border: 5px solid #F4F4F8;
            position: absolute;
            top: -50px;
            left: 20px;
            object-fit: cover;
        }
        
        .restaurant-title-section {
            margin-left: 130px;
            margin-bottom: 20px;
        }
        
        .restaurant-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .restaurant-category {
            color: #666;
            font-size: 14px;
        }
        
        .rating-badge {
            background: #FFD700;
            color: #F4F4F8;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        
        .restaurant-stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            padding: 15px;
            background: #F4F4F8;
            border-radius: 10px;
        }
        
        .stat-item {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #ffa500;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0 10px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffa500;
        }
        
        .tab-navigation {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .tab-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
        }
        
        .tab-btn.active {
            background: #ffa500;
            color: #f4f4f8;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .menu-item {
            background: #F4F4F8;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .menu-item:hover {
            transform: translateY(-5px);
        }
        
        .menu-item-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        
        .menu-item-info {
            padding: 15px;
        }
        
        .menu-item-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 16px;
        }
        
        .menu-item-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .menu-item-price {
            font-size: 18px;
            font-weight: bold;
            color: #ffa500;
        }
        
        .add-to-cart-btn {
            background: #ffa500;
            color: #F4F4F8;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            float: right;
        }
        
        .review-item {
            background: #F4F4F8;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .review-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .review-rating {
            color: #ffa500;
            font-weight: bold;
        }
        
        .review-date {
            color: #999;
            font-size: 12px;
        }
        
        .review-content {
            color: #333;
            line-height: 1.5;
        }
        
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .restaurant-photo {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .restaurant-photo:hover {
            transform: scale(1.05);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .info-card {
            background: #F4F4F8;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .info-card h4 {
            color: #ffa500;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .info-item {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-item i {
            color: #666;
            width: 20px;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        
        .action-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        
        .action-btn {
            background: rgba(255,255,255,0.9);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .restaurant-logo {
                width: 80px;
                height: 80px;
                top: -40px;
            }
            
            .restaurant-title-section {
                margin-left: 100px;
            }
            
            .restaurant-stats {
                flex-wrap: wrap;
            }
            
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="restaurant-header">
        <button class="back-button" onclick="window.history.back()">←</button>
        <div class="action-buttons">
            <button class="action-btn" onclick="shareRestaurant()">🔗</button>
            <button class="action-btn" onclick="toggleFavorite()">❤️</button>
        </div>
        <img id="restaurantCover" class="restaurant-cover" src="" alt="Cover">
    </div>
    
    <!-- Restaurant Info -->
    <div class="restaurant-info">
        <img id="restaurantLogo" class="restaurant-logo" src="" alt="Logo">
        
        <div class="restaurant-title-section">
            <h1 id="restaurantName" class="restaurant-name">Loading...</h1>
            <p id="restaurantCategory" class="restaurant-category"></p>
            <div id="restaurantRating" class="rating-badge">
                <span>4.5</span>
                <span>★</span>
            </div>
        </div>
        
        <div class="restaurant-stats">
            <div class="stat-item">
                <div class="stat-value" id="deliveryTime">20-30 мин</div>
                <div class="stat-label">Хүргэлтийн хугацаа</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="deliveryFee">₮2,500</div>
                <div class="stat-label">Хүргэлтийн төлбөр</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="minOrder">₮15,000</div>
                <div class="stat-label">Хамгийн бага захиалга</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="reviewCount">1.2к</div>
                <div class="stat-label">Үнэлгээ</div>
            </div>
        </div>
        
        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-btn active" data-tab="menu">ЦЭС</button>
            <button class="tab-btn" data-tab="info">МЭДЭЭЛЭЛ</button>
            <button class="tab-btn" data-tab="photos">ЗУРАГ</button>
            <button class="tab-btn" data-tab="reviews">ҮНЭЛГЭЭ</button>
            <button class="tab-btn" data-tab="location">БАЙРШИЛ</button>
        </div>
        
        <!-- Menu Tab -->
        <div id="menuTab" class="tab-content active">
            <h3 class="section-title">ЦЭС</h3>
            <div class="menu-grid" id="menuItems">
                <!-- Menu items will be loaded here -->
            </div>
        </div>
        
        <!-- Info Tab -->
        <div id="infoTab" class="tab-content">
            <h3 class="section-title">ҮЙЛ АЖИЛЛАГАА</h3>
            <div class="info-grid">
                <div class="info-card">
                    <h4>ЦАГ АЖИЛЛАГАА</h4>
                    <div id="openingHours">
                        <!-- Hours will be loaded here -->
                    </div>
                </div>
                
                <div class="info-card">
                    <h4>ХАЯГ БАЙРШИЛ</h4>
                    <div class="info-item">
                        <i>📍</i>
                        <span id="restaurantAddress">Төв цэнгэлдэх хүрээлэн, 3-р давхар</span>
                    </div>
                    <div class="info-item">
                        <i>📞</i>
                        <span id="restaurantPhone">7711-0022</span>
                    </div>
                </div>
                
                <div class="info-card">
                    <h4>ОНЦЛОХ ҮЙЛЧИЛГЭЭ</h4>
                    <div id="restaurantFeatures">
                        <!-- Features will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Photos Tab -->
        <div id="photosTab" class="tab-content">
            <h3 class="section-title">ЗУРАГ</h3>
            <div class="photo-grid" id="restaurantPhotos">
                <!-- Photos will be loaded here -->
            </div>
        </div>
        
        <!-- Reviews Tab -->
        <div id="reviewsTab" class="tab-content">
            <h3 class="section-title">ҮНЭЛГЭЭ</h3>
            <div id="reviewsList">
                <!-- Reviews will be loaded here -->
            </div>
        </div>
        
        <!-- Location Tab -->
        <div id="locationTab" class="tab-content">
            <h3 class="section-title">БАЙРШИЛ</h3>
            <div id="map" style="height: 300px; border-radius: 10px; overflow: hidden; margin-top: 15px;"></div>
        </div>
    </div>
    
    <!-- Floating Order Button -->
    <div style="position: fixed; bottom: 20px; right: 20px;">
        <button onclick="orderNow()" style="
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,107,107,0.3);
        ">Захиалах</button>
    </div>
    
    <script>
        // Get restaurant ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantId = urlParams.get('id') || 1;
        
        // Restaurant data
        const restaurants = {
            1: {
                id: 1,
                name: "IL FIORE",
                category: "Итали, Европ хоол",
                rating: 4.8,
                reviewCount: "1.2к",
                logo: "./img/il-fiore.png",
                cover: "./img/restaurant-cover1.jpg",
                deliveryTime: "20-30 мин",
                deliveryFee: "₮2,500",
                minOrder: "₮15,000",
                address: "Төв цэнгэлдэх хүрээлэн, 3-р давхар",
                phone: "7711-0022",
                openingHours: [
                    "Даваа - Баасан: 10:00 - 22:00",
                    "Бямба - Ням: 10:00 - 23:00"
                ],
                features: [
                    "Веган сонголттой",
                    "Бэлэн хоол",
                    "Байршилд хооллох",
                    "Хүргэлт",
                    "Том групп"
                ],
                photos: [
                    "./img/restaurant1-1.jpg",
                    "./img/restaurant1-2.jpg",
                    "./img/restaurant1-3.jpg",
                    "./img/restaurant1-4.jpg"
                ],
                menu: [
                    {
                        id: 1,
                        name: "Пепперони Пицца",
                        description: "Шанцайтай, пиперони бяслагаар хийсэн сонгомол пицца",
                        price: "₮24,900",
                        image: "./img/menu/pizza1.jpg",
                        category: "Пицца"
                    },
                    {
                        id: 2,
                        name: "Гарилик Наан",
                        description: "Сармис, цөцгийн тосоор амтласан наан талх",
                        price: "₮8,900",
                        image: "./img/menu/naan.jpg",
                        category: "Талх"
                    },
                    {
                        id: 3,
                        name: "Спагетти Карбонара",
                        description: "Өндөг, пармезан бяслаг, гахайн махтай спагетти",
                        price: "₮22,500",
                        image: "./img/menu/spaghetti.jpg",
                        category: "Паста"
                    },
                    {
                        id: 4,
                        name: "Цезарь Салат",
                        description: "Тахиан мах, пармезан, цезарь соустай салат",
                        price: "₮16,900",
                        image: "./img/menu/salad.jpg",
                        category: "Салат"
                    }
                ],
                reviews: [
                    {
                        user: "Батбаяр",
                        avatar: "./img/user1.jpg",
                        rating: 5,
                        date: "2024-01-15",
                        comment: "Маш амттай, хурдан хүргэлт. Дахиж захиалах болно!"
                    },
                    {
                        user: "Сараа",
                        avatar: "./img/user2.jpg",
                        rating: 4,
                        date: "2024-01-10",
                        comment: "Пицца маш шинэ, шанцайтай байсан. Үйлчилгээ сайн."
                    }
                ],
                location: {
                    lat: 47.91740,
                    lng: 106.92005
                }
            },
            2: {
                id: 2,
                name: "ALFIE RESTAURANT",
                category: "Олон улсын хоол",
                rating: 4.8,
                reviewCount: "1.1к",
                logo: "./img/alfie.jpeg",
                cover: "./img/restaurant-cover2.jpg",
                deliveryTime: "25-35 мин",
                deliveryFee: "₮3,000",
                minOrder: "₮20,000",
                address: "СBD, Prime Tower, 5-р давхар",
                phone: "7711-0033",
                openingHours: [
                    "Даваа - Ням: 11:00 - 23:00"
                ],
                features: [
                    "Веган сонголттой",
                    "Бэлэн хоол",
                    "Хүргэлт",
                    "VIP өрөө",
                    "Зочны машины зогсоол"
                ],
                menu: [
                    {
                        id: 1,
                        name: "Англи Frühstück",
                        description: "Өндөг, бекон, хэрчсэн хүнсний ногоотой өглөөний цай",
                        price: "₮18,900",
                        image: "./img/menu/breakfast.jpg",
                        category: "Өглөөний цай"
                    }
                ],
                reviews: [],
                location: {
                    lat: 47.91800,
                    lng: 106.92100
                }
            }
        };
        
        // Load restaurant data
        function loadRestaurant() {
            const restaurant = restaurants[restaurantId] || restaurants[1];
            
            // Update basic info
            document.getElementById('restaurantName').textContent = restaurant.name;
            document.getElementById('restaurantCategory').textContent = restaurant.category;
            document.getElementById('restaurantRating').innerHTML = `<span>${restaurant.rating}</span><span>★</span>`;
            document.getElementById('reviewCount').textContent = restaurant.reviewCount;
            document.getElementById('deliveryTime').textContent = restaurant.deliveryTime;
            document.getElementById('deliveryFee').textContent = restaurant.deliveryFee;
            document.getElementById('minOrder').textContent = restaurant.minOrder;
            document.getElementById('restaurantAddress').textContent = restaurant.address;
            document.getElementById('restaurantPhone').textContent = restaurant.phone;
            
            // Update images
            document.getElementById('restaurantCover').src = restaurant.cover;
            document.getElementById('restaurantLogo').src = restaurant.logo;
            
            // Load opening hours
            const hoursContainer = document.getElementById('openingHours');
            hoursContainer.innerHTML = restaurant.openingHours.map(hour => 
                `<div class="info-item"><i>🕒</i><span>${hour}</span></div>`
            ).join('');
            
            // Load features
            const featuresContainer = document.getElementById('restaurantFeatures');
            featuresContainer.innerHTML = restaurant.features.map(feature => 
                `<div class="info-item"><i>✓</i><span>${feature}</span></div>`
            ).join('');
            
            // Load menu
            loadMenu(restaurant.menu);
            
            // Load photos
            loadPhotos(restaurant.photos);
            
            // Load reviews
            loadReviews(restaurant.reviews);
            
            // Load map
            loadMap(restaurant.location);
        }
        
        function loadMenu(menuItems) {
            const menuContainer = document.getElementById('menuItems');
            menuContainer.innerHTML = menuItems.map(item => `
                <div class="menu-item" data-id="${item.id}">
                    <img src="${item.image}" alt="${item.name}" class="menu-item-image">
                    <div class="menu-item-info">
                        <div class="menu-item-name">${item.name}</div>
                        <div class="menu-item-description">${item.description}</div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div class="menu-item-price">${item.price}</div>
                            <button class="add-to-cart-btn" onclick="addToCart(${item.id})">+ Нэмэх</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function loadPhotos(photos) {
            const photosContainer = document.getElementById('restaurantPhotos');
            photosContainer.innerHTML = photos.map(photo => `
                <img src="${photo}" class="restaurant-photo" onclick="openPhoto('${photo}')">
            `).join('');
        }
        
        function loadReviews(reviews) {
            const reviewsContainer = document.getElementById('reviewsList');
            if (reviews.length === 0) {
                reviewsContainer.innerHTML = '<p style="text-align: center; color: #666;">Үнэлгээ байхгүй байна</p>';
                return;
            }
            
            reviewsContainer.innerHTML = reviews.map(review => `
                <div class="review-item">
                    <div class="review-header">
                        <div class="review-user">
                            <img src="${review.avatar}" class="user-avatar">
                            <div>
                                <div style="font-weight: bold;">${review.user}</div>
                                <div class="review-rating">${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}</div>
                            </div>
                        </div>
                        <div class="review-date">${review.date}</div>
                    </div>
                    <div class="review-content">${review.comment}</div>
                </div>
            `).join('');
        }
        
        function loadMap(location) {
            const mapContainer = document.getElementById('map');
            mapContainer.innerHTML = `
                <iframe 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    scrolling="no" 
                    marginheight="0" 
                    marginwidth="0" 
                    src="https://maps.google.com/maps?q=${location.lat},${location.lng}&z=16&output=embed"
                    style="border:0;">
                </iframe>
            `;
        }
        
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.dataset.tab;
                
                // Update active tab button
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Show active tab content
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(tabId + 'Tab').classList.add('active');
            });
        });
        
        // Cart functionality
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        function addToCart(itemId) {
            const restaurant = restaurants[restaurantId];
            const item = restaurant.menu.find(m => m.id === itemId);
            
            cart.push({
                restaurantId: restaurantId,
                restaurantName: restaurant.name,
                itemId: itemId,
                itemName: item.name,
                price: item.price,
                quantity: 1
            });
            
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(`${item.name} сагсанд нэмэгдлээ!`);
        }
        
        function orderNow() {
            if (cart.length === 0) {
                alert('Эхлээд хоол нэмнэ үү!');
                return;
            }
            
            // Redirect to order page
            window.location.href = `order.html?restaurant=${restaurantId}`;
        }
        
        function shareRestaurant() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('Холбоосыг хавсраглаа!');
            });
        }
        
        function toggleFavorite() {
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            const restaurant = restaurants[restaurantId];
            
            const index = favorites.findIndex(fav => fav.id === restaurantId);
            
            if (index === -1) {
                favorites.push({
                    id: restaurantId,
                    name: restaurant.name,
                    logo: restaurant.logo,
                    rating: restaurant.rating
                });
                alert('Дуртай жагсаалтад нэмэгдлээ!');
            } else {
                favorites.splice(index, 1);
                alert('Дуртай жагсаалтаас хасагдлаа!');
            }
            
            localStorage.setItem('favorites', JSON.stringify(favorites));
        }
        
        function openPhoto(photoUrl) {
            window.open(photoUrl, '_blank');
        }
        
        
        document.addEventListener('DOMContentLoaded', loadRestaurant);
    </script>
</body>
</html>
